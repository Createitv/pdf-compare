name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting package version to $VERSION"
          node -e "const fs=require('fs'); const f='src-tauri/tauri.conf.json'; const o=JSON.parse(fs.readFileSync(f,'utf8')); o.version='$VERSION'; fs.writeFileSync(f, JSON.stringify(o,null,2)+'\n');"
          node -e "const fs=require('fs'); const f='src-tauri/Cargo.toml'; let s=fs.readFileSync(f,'utf8'); s=s.replace(/^version\s*=\s*\"[^\"]*\"/m, 'version = \"$VERSION\"'); fs.writeFileSync(f, s);"
          node -e "const fs=require('fs'); const f='src-tauri/algo/Cargo.toml'; let s=fs.readFileSync(f,'utf8'); s=s.replace(/^version\s*=\s*\"[^\"]*\"/m, 'version = \"$VERSION\"'); fs.writeFileSync(f, s);"
          node -e "const fs=require('fs'); const f='package.json'; const o=JSON.parse(fs.readFileSync(f,'utf8')); o.version='$VERSION'; fs.writeFileSync(f, JSON.stringify(o,null,2)+'\n');"
          echo '--- updated ---'
          grep -E '^version' src-tauri/Cargo.toml src-tauri/algo/Cargo.toml || true
          grep '"version"' src-tauri/tauri.conf.json package.json || true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "PDF Compare ${{ github.ref_name }}"
          releaseBody: "自动构建产物。下载对应平台安装包即可使用。"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
