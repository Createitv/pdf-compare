[package]
name = "pdf-compare"
version = "0.1.0"
description = "Compare two PDF folders and copy missing files"
authors = ["ling"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "pdf_compare_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pdfcmp-algo = { path = "./algo" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
